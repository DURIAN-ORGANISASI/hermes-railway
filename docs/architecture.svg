<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">Hermes Agent Railway architecture</title><desc id="desc">Railway variables select a startup mode, launch Hermes Agent, and persist state in a mounted volume.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1020"/><stop offset="1" stop-color="#1E2240"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#62DCE7"/></marker></defs><rect width="1200" height="360" rx="22" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="358" rx="21" fill="none" stroke="#3C4969"/><text x="44" y="48" fill="#F7F8FF" font-family="Arial,sans-serif" font-size="23" font-weight="850">DEPLOYMENT FLOW</text><text x="44" y="73" fill="#AAB9D7" font-family="Arial,sans-serif" font-size="13">Conceptual view, not an official upstream internal diagram</text><rect x="44" y="122" width="220" height="120" rx="16" fill="#141E34" stroke="#536486"/><text x="66" y="157" fill="#F7F8FF" font-family="Arial,sans-serif" font-size="17" font-weight="800">Railway variables</text><text x="66" y="184" fill="#C7D3E8" font-family="Arial,sans-serif" font-size="13">Secrets + DEPLOY_MODE</text><text x="66" y="207" fill="#91A6C8" font-family="Arial,sans-serif" font-size="12">Port + volume</text><rect x="334" y="122" width="220" height="120" rx="16" fill="#191F3C" stroke="#7979C4"/><text x="356" y="157" fill="#F7F8FF" font-family="Arial,sans-serif" font-size="17" font-weight="800">Mode selector</text><text x="356" y="184" fill="#C7D3E8" font-family="Arial,sans-serif" font-size="13">dashboard</text><text x="356" y="207" fill="#C7D3E8" font-family="Arial,sans-serif" font-size="13">or variables</text><rect x="624" y="122" width="220" height="120" rx="16" fill="#141E34" stroke="#536486"/><text x="646" y="157" fill="#F7F8FF" font-family="Arial,sans-serif" font-size="17" font-weight="800">Hermes Agent</text><text x="646" y="184" fill="#C7D3E8" font-family="Arial,sans-serif" font-size="13">Gateway + model</text><text x="646" y="207" fill="#91A6C8" font-family="Arial,sans-serif" font-size="12">Tools + chat adapters</text><rect x="914" y="122" width="242" height="120" rx="16" fill="#141E34" stroke="#3AA7B9"/><text x="936" y="157" fill="#F7F8FF" font-family="Arial,sans-serif" font-size="17" font-weight="800">Volume /opt/data</text><text x="936" y="184" fill="#C7D3E8" font-family="Arial,sans-serif" font-size="13">Persistent configuration</text><text x="936" y="207" fill="#91A6C8" font-family="Arial,sans-serif" font-size="12">Sessions + skills</text><path d="M264 182H321M554 182H611M844 182H901" stroke="#62DCE7" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="44" y="279" width="1112" height="42" rx="12" fill="#111A2D" stroke="#3D4F70"/><text x="64" y="305" fill="#B9C7DF" font-family="Arial,sans-serif" font-size="13">Protect Dashboard access properly before exposing it to the internet.</text></svg>
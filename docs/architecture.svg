<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc"><title id="title">Hermes Agent Railway three-mode architecture</title><desc id="desc">One repository feeds three independent Railway services. Dashboard, Variables, and Ubuntu each use a separate persistent volume.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1020"/><stop offset="1" stop-color="#1E2240"/></linearGradient></defs><rect width="1200" height="470" rx="22" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="468" rx="21" fill="none" stroke="#3C4969"/><text x="42" y="45" fill="#F7F8FF" font-family="Arial,sans-serif" font-size="23" font-weight="850">THREE ISOLATED RAILWAY SERVICES</text><text x="42" y="72" fill="#AAB9D7" font-family="Arial,sans-serif" font-size="13">One repository and branch; each service has its own config, secrets, and persistent data.</text><rect x="42" y="105" width="348" height="274" rx="18" fill="#141E34" stroke="#7979C4" stroke-width="2"/><text x="64" y="142" fill="#C8BFFF" font-family="Arial,sans-serif" font-size="13" font-weight="700">SERVICE 1</text><text x="64" y="177" fill="#F7F8FF" font-family="Arial,sans-serif" font-size="22" font-weight="850">Dashboard</text><text x="64" y="211" fill="#C7D3E8" font-family="Arial,sans-serif" font-size="14">Root Dockerfile</text><text x="64" y="236" fill="#C7D3E8" font-family="Arial,sans-serif" font-size="14">DEPLOY_MODE=dashboard</text><rect x="64" y="271" width="304" height="78" rx="12" fill="#202746" stroke="#7979C4"/><text x="82" y="302" fill="#F7F8FF" font-family="Arial,sans-serif" font-size="15" font-weight="750">Its own /opt/data volume</text><text x="82" y="326" fill="#AAB9D7" font-family="Arial,sans-serif" font-size="12">Dashboard config + sessions</text><rect x="426" y="105" width="348" height="274" rx="18" fill="#141E34" stroke="#3AA7B9" stroke-width="2"/><text x="448" y="142" fill="#76E2EE" font-family="Arial,sans-serif" font-size="13" font-weight="700">SERVICE 2</text><text x="448" y="177" fill="#F7F8FF" font-family="Arial,sans-serif" font-size="22" font-weight="850">Variables</text><text x="448" y="211" fill="#C7D3E8" font-family="Arial,sans-serif" font-size="14">Root Dockerfile</text><text x="448" y="236" fill="#C7D3E8" font-family="Arial,sans-serif" font-size="14">DEPLOY_MODE=variables</text><rect x="448" y="271" width="304" height="78" rx="12" fill="#17313A" stroke="#3AA7B9"/><text x="466" y="302" fill="#F7F8FF" font-family="Arial,sans-serif" font-size="15" font-weight="750">Its own /opt/data volume</text><text x="466" y="326" fill="#B6DCE4" font-family="Arial,sans-serif" font-size="12">Generated config + Gateway state</text><rect x="810" y="105" width="348" height="274" rx="18" fill="#141E34" stroke="#DA9655" stroke-width="2"/><text x="832" y="142" fill="#FFC58F" font-family="Arial,sans-serif" font-size="13" font-weight="700">SERVICE 3</text><text x="832" y="177" fill="#F7F8FF" font-family="Arial,sans-serif" font-size="22" font-weight="850">Ubuntu Terminal</text><text x="832" y="211" fill="#C7D3E8" font-family="Arial,sans-serif" font-size="14">ubuntu/Dockerfile + ttyd</text><text x="832" y="236" fill="#C7D3E8" font-family="Arial,sans-serif" font-size="14">CLI + optional Gateway</text><rect x="832" y="271" width="304" height="78" rx="12" fill="#34291F" stroke="#DA9655"/><text x="850" y="302" fill="#F7F8FF" font-family="Arial,sans-serif" font-size="15" font-weight="750">Its own /opt/data volume</text><text x="850" y="326" fill="#E9C9A8" font-family="Arial,sans-serif" font-size="12">Optional separate /data volume</text><rect x="42" y="405" width="1116" height="36" rx="10" fill="#111A2D" stroke="#3D4F70"/><text x="60" y="428" fill="#B9C7DF" font-family="Arial,sans-serif" font-size="13">Never mount the same Volume into multiple modes. Protect public Dashboard and terminal domains.</text></svg>